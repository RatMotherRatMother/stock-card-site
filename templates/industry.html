<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Industry Tarot</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="container">

<nav>
    <a href="/tracker">Tracker</a>
    <a href="/collection">Collection</a>
    <a href="/industry" class="active">Industry Tarot</a>
</nav>

<h1>Industry Tarot</h1>
<p style="color:#6a5c48; font-family:Georgia,serif; font-size:0.84rem; margin-bottom:20px;">
    Click a card to analyse the industry.
</p>

<!-- Card grid — populated by JS -->
<div id="tarot-grid">
    <span id="tarot-status" style="color:#6a5c48; font-style:italic; font-size:0.82rem;">
        Loading industries…
    </span>
</div>

<!-- ------------------------------------------------------------------ -->
<!-- Modal overlay — hidden until a card is clicked                       -->
<!-- ------------------------------------------------------------------ -->
<div id="tarot-modal-overlay">
    <div id="tarot-modal-content">

        <!-- Close button -->
        <button id="tarot-modal-close" title="Close (Esc)">✕</button>

        <!-- Modal header -->
        <h2 id="tarot-modal-title">—</h2>
        <p id="tarot-modal-subtitle" style="color:#6a5c48; font-family:Georgia,serif;
            font-size:0.82rem; margin-bottom:20px;">Industry Analysis</p>

        <!-- ── Five Forces of Profitability ───────────────────────── -->
        <div class="analysis-section">
            <h3>Five Forces of Profitability</h3>
            <p style="color:#6a5c48; font-size:0.78rem; margin-bottom:14px;">
                Rate each force 1 (low) → 5 (high). Saves instantly to Google Sheets.
            </p>

            <div id="five-forces-container">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- ── Structural Analysis ────────────────────────────────── -->
        <div class="analysis-section">
            <h3>Structural Analysis</h3>
            <p style="color:#6a5c48; font-size:0.78rem; margin-bottom:14px;">
                Notes on each structural dimension.
            </p>

            <div id="structural-container">
                <!-- Populated by JS -->
            </div>
        </div>

    </div><!-- /#tarot-modal-content -->
</div><!-- /#tarot-modal-overlay -->

<!-- ------------------------------------------------------------------ -->
<!-- JavaScript                                                           -->
<!-- ------------------------------------------------------------------ -->
<script>
// ===========================================================================
// Industry Tarot — page script
// ===========================================================================

// ── Config: Five Forces ──────────────────────────────────────────────────────
// Each entry maps a display label to the Google Sheets column name (field).
const FIVE_FORCES = [
    { label: "Bargaining power of suppliers", field: "supplier_power"  },
    { label: "Bargaining power of buyers",    field: "buyer_power"     },
    { label: "Threat of new entrants",        field: "new_entrants"    },
    { label: "Threat of substitutes",         field: "substitutes"     },
    { label: "Rivalry among existing firms",  field: "rivalry"         },
];

// ── Config: Structural Analysis ──────────────────────────────────────────────
// Each entry is a note-box label. Notes are stored in notes.json using the
// namespaced key  "industry::<IndustryName>::<field>"
const STRUCTURAL_ITEMS = [
    { label: "Specialization",                   field: "specialization"         },
    { label: "Brand Identification",             field: "brand_identification"   },
    { label: "Push vs Pull",                     field: "push_vs_pull"           },
    { label: "Channel Selection",                field: "channel_selection"      },
    { label: "Product Quality",                  field: "product_quality"        },
    { label: "Tech Leadership",                  field: "tech_leadership"        },
    { label: "Vertical Integration",             field: "vertical_integration"   },
    { label: "Cost Position",                    field: "cost_position"          },
    { label: "Service",                          field: "service"                },
    { label: "Price Policy",                     field: "price_policy"           },
    { label: "Leverage",                         field: "leverage"               },
    { label: "Relationship with Parent Company", field: "relationship_parent"    },
    { label: "Relationship to Government",       field: "relationship_govt"      },
];

// ── State ────────────────────────────────────────────────────────────────────
let _activeIndustry = null;   // the full industry row object currently open
let _allIndustries  = [];     // cached list from /api/industries

// ── DOM refs ─────────────────────────────────────────────────────────────────
const grid          = document.getElementById("tarot-grid");
const status        = document.getElementById("tarot-status");
const overlay       = document.getElementById("tarot-modal-overlay");
const modalContent  = document.getElementById("tarot-modal-content");
const modalClose    = document.getElementById("tarot-modal-close");
const modalTitle    = document.getElementById("tarot-modal-title");
const forcesContainer     = document.getElementById("five-forces-container");
const structuralContainer = document.getElementById("structural-container");

// ===========================================================================
// 1. Load and render the card grid
// ===========================================================================
async function loadIndustries() {
    try {
        const res  = await fetch("/api/industries");
        const data = await res.json();
        _allIndustries = data.industries || [];

        if (_allIndustries.length === 0) {
            status.textContent = "No industries found. Add rows to the industries sheet.";
            return;
        }

        status.style.display = "none";
        renderGrid(_allIndustries);
    } catch (err) {
        status.textContent = `Error loading industries: ${err}`;
    }
}

function renderGrid(industries) {
    // Remove any previously rendered cards (keep the status span)
    grid.querySelectorAll(".tarot-card").forEach(c => c.remove());

    industries.forEach(ind => {
        const card = document.createElement("div");
        card.className = "tarot-card";
        card.dataset.industry = ind.industry;

        if (ind.image_url) {
            const img = document.createElement("img");
            img.src = ind.image_url;
            img.alt = ind.industry;
            img.loading = "lazy";
            card.appendChild(img);
        } else {
            // Fallback panel when no image is set
            card.classList.add("tarot-card--no-image");
        }

        // Industry name label overlaid on the card
        const label = document.createElement("div");
        label.className = "tarot-card-label";
        label.textContent = ind.industry;
        card.appendChild(label);

        card.addEventListener("click", () => openModal(ind));
        grid.appendChild(card);
    });
}

// ===========================================================================
// 2. Modal open / close
// ===========================================================================
function openModal(industry) {
    _activeIndustry = industry;
    modalTitle.textContent = industry.industry;

    // Build the modal body
    buildFiveForces(industry);
    buildStructural(industry);

    // Show overlay
    overlay.classList.add("visible");
    document.body.style.overflow = "hidden"; // prevent background scroll
}

function closeModal() {
    overlay.classList.remove("visible");
    document.body.style.overflow = "";
    _activeIndustry = null;
}

// Close on ✕ button
modalClose.addEventListener("click", closeModal);

// Close on Escape key
document.addEventListener("keydown", e => {
    if (e.key === "Escape" && overlay.classList.contains("visible")) closeModal();
});

// Close on click outside the modal content panel
overlay.addEventListener("click", e => {
    if (e.target === overlay) closeModal();
});

// ===========================================================================
// 3. Build Five Forces section
// ===========================================================================
function buildFiveForces(industry) {
    forcesContainer.innerHTML = "";

    FIVE_FORCES.forEach(force => {
        const currentRating = industry[force.field] ?? null;

        const row = document.createElement("div");
        row.className = "force-row";

        // Label
        const lbl = document.createElement("div");
        lbl.className = "force-label";
        lbl.textContent = force.label;

        // Rating buttons 1–5
        const btns = document.createElement("div");
        btns.className = "rating-btn-group";

        for (let i = 1; i <= 5; i++) {
            const btn = document.createElement("button");
            btn.className = "rating-btn";
            btn.textContent = i;
            btn.dataset.value = i;
            if (currentRating === i) btn.classList.add("active");

            btn.addEventListener("click", () =>
                saveIndustryRating(industry.industry, force.field, i, btns)
            );
            btns.appendChild(btn);
        }

        // Save feedback text
        const feedback = document.createElement("span");
        feedback.className = "rating-feedback";
        btns.appendChild(feedback);

        // Notes box for this force
        const notesKey = `industry::${industry.industry}::${force.field}`;
        const notesBox = buildNotesBox(notesKey);

        row.appendChild(lbl);
        row.appendChild(btns);
        row.appendChild(notesBox);
        forcesContainer.appendChild(row);
    });
}

// ===========================================================================
// 4. Build Structural Analysis section
// ===========================================================================
function buildStructural(industry) {
    structuralContainer.innerHTML = "";

    STRUCTURAL_ITEMS.forEach(item => {
        const block = document.createElement("div");
        block.className = "structural-block";

        const lbl = document.createElement("div");
        lbl.className = "structural-label";
        lbl.textContent = item.label;

        const notesKey = `industry::${industry.industry}::${item.field}`;
        const notesBox = buildNotesBox(notesKey);

        block.appendChild(lbl);
        block.appendChild(notesBox);
        structuralContainer.appendChild(block);
    });
}

// ===========================================================================
// 5. Notes box builder  (loads existing notes, supports add + delete)
// ===========================================================================
function buildNotesBox(key) {
    const wrap = document.createElement("div");
    wrap.className = "analysis-notes-wrap";

    // Textarea + Post button row
    const inputRow = document.createElement("div");
    inputRow.className = "analysis-notes-input-row";

    const textarea = document.createElement("textarea");
    textarea.className = "analysis-notes-box";
    textarea.placeholder = "Add a note…";
    textarea.rows = 2;

    const postBtn = document.createElement("button");
    postBtn.className = "analysis-notes-post-btn";
    postBtn.textContent = "Post";

    inputRow.appendChild(textarea);
    inputRow.appendChild(postBtn);

    // Notes list
    const list = document.createElement("ul");
    list.className = "analysis-notes-list";

    wrap.appendChild(inputRow);
    wrap.appendChild(list);

    // Load existing notes
    loadNotes(key, list);

    // Post on button click
    postBtn.addEventListener("click", () => {
        const text = textarea.value.trim();
        if (!text) return;
        postBtn.disabled = true;
        fetch("/api/notes", {
            method:  "POST",
            headers: { "Content-Type": "application/json" },
            body:    JSON.stringify({ symbol: key, text }),
        })
        .then(r => r.json())
        .then(data => {
            textarea.value   = "";
            postBtn.disabled = false;
            renderNotesList(key, data.notes || [], list);
        })
        .catch(() => { postBtn.disabled = false; });
    });

    // Ctrl+Enter to post
    textarea.addEventListener("keydown", e => {
        if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) postBtn.click();
    });

    return wrap;
}

function loadNotes(key, listEl) {
    fetch(`/api/notes?symbol=${encodeURIComponent(key)}`)
        .then(r => r.json())
        .then(data => renderNotesList(key, data.notes || [], listEl))
        .catch(() => {});
}

function renderNotesList(key, notes, listEl) {
    listEl.innerHTML = "";
    if (notes.length === 0) return;
    notes.forEach((n, i) => {
        const li   = document.createElement("li");
        li.className = "analysis-notes-item";

        const del  = document.createElement("button");
        del.className   = "notes-del-btn";
        del.textContent = "×";
        del.addEventListener("click", () => {
            fetch(`/api/notes/${encodeURIComponent(key)}/${i}`, { method: "DELETE" })
                .then(r => r.json())
                .then(data => renderNotesList(key, data.notes || [], listEl))
                .catch(() => {});
        });

        const txt  = document.createElement("span");
        txt.className   = "notes-text";
        txt.textContent = n.text;

        const meta = document.createElement("span");
        meta.className   = "notes-meta";
        meta.textContent = n.timestamp;

        li.appendChild(del);
        li.appendChild(txt);
        li.appendChild(meta);
        listEl.appendChild(li);
    });
}

// ===========================================================================
// 6. Save a Five Forces rating to Google Sheets
// ===========================================================================
async function saveIndustryRating(industryName, field, value, btnsContainer) {
    // Optimistically update button state
    btnsContainer.querySelectorAll(".rating-btn").forEach(b => {
        b.classList.toggle("active", parseInt(b.dataset.value) === value);
        b.disabled = true;
    });

    const feedback = btnsContainer.querySelector(".rating-feedback");
    if (feedback) { feedback.textContent = "Saving…"; }

    try {
        const res  = await fetch("/api/industry_rating", {
            method:  "POST",
            headers: { "Content-Type": "application/json" },
            body:    JSON.stringify({ industry: industryName, field, value }),
        });
        const data = await res.json();
        if (feedback) {
            feedback.textContent = data.ok ? "Saved ✓" : `Error: ${data.error}`;
            setTimeout(() => { feedback.textContent = ""; }, 2000);
        }
        // Update the local cache so reopening the modal shows the new value
        const cached = _allIndustries.find(i => i.industry === industryName);
        if (cached) cached[field] = value;
    } catch (err) {
        if (feedback) { feedback.textContent = "Save failed"; }
    } finally {
        btnsContainer.querySelectorAll(".rating-btn").forEach(b => { b.disabled = false; });
    }
}

// ===========================================================================
// Boot
// ===========================================================================
loadIndustries();
</script>

</div><!-- /.container -->
</body>
</html>
